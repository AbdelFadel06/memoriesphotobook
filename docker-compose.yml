x-backend: &backend
  # web and worker share one image so they never drift apart
  image: photobook-backend:dev
  build: ./backend
  env_file: .env
  volumes:
    - ./backend:/app:z
    - ./shared:/shared:ro,z
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    storage:
      condition: service_started

services:
  web:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    # -B runs the beat scheduler (cleanup_exports) in this single worker.
    command: celery -A config worker -B -Q images,maintenance -l info

  pdf-worker:
    <<: *backend
    image: photobook-pdf:dev
    build:
      context: ./backend
      dockerfile: Dockerfile.pdf
    command: celery -A config worker -Q pdf --concurrency 1 -l info
    environment:
      FRONTEND_INTERNAL_URL: http://frontend:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      storage:
        condition: service_started
      frontend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    # Not published: only the pdf-worker uses it. Develop with `npm run dev` on the host.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  # Local S3-compatible storage; replaced by R2/B2 in production.
  # The bucket is created by `manage.py ensure_bucket`.
  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storagedata:/data

volumes:
  pgdata:
  storagedata:
